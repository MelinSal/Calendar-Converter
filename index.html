<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendar Converter</title>
<style>
  :root[data-theme="dark"]{
    --bg:#0a0a0a;
    --surface:#151515;
    --surface-2:#1e1e1e;
    --border:#2a2a2a;
    --text:#f2f2f2;
    --text-dim:#9a9a9a;
    --accent:#6ee7c8;
    --accent-2:#8b7bff;
    --danger:#ff6b6b;
  }
  :root[data-theme="light"]{
    --bg:#f5f5f5;
    --surface:#ffffff;
    --surface-2:#eeeeee;
    --border:#dcdcdc;
    --text:#161616;
    --text-dim:#5c5c5c;
    --accent:#0f9d78;
    --accent-2:#5b46e0;
    --danger:#c92a2a;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    overflow-x:hidden;
    transition:background .3s ease,color .3s ease;
  }
  .fa{
    font-family:"Vazirmatn","Tahoma",sans-serif;
    direction:rtl;
  }

  /* subtle floating background blobs */
  .blob{
    position:fixed;
    bottom:-120px;
    width:280px;
    height:280px;
    border-radius:50%;
    filter:blur(70px);
    opacity:.35;
    z-index:0;
    pointer-events:none;
    animation:float 14s ease-in-out infinite;
  }
  .blob.b1{left:8%;background:var(--accent);animation-delay:0s;}
  .blob.b2{left:45%;background:var(--accent-2);width:340px;height:340px;animation-delay:-4s;}
  .blob.b3{left:75%;background:var(--accent);width:220px;height:220px;animation-delay:-9s;}
  @keyframes float{
    0%,100%{transform:translateY(0) scale(1);}
    50%{transform:translateY(-60px) scale(1.08);}
  }

  .theme-toggle{
    position:fixed;
    top:20px;
    right:20px;
    z-index:10;
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:999px;
    padding:8px 14px;
    font-size:13px;
    cursor:pointer;
  }
  .theme-toggle:hover{border-color:var(--accent);}

  .screen{
    position:relative;
    z-index:1;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:32px 20px 80px;
  }
  [hidden]{display:none!important;}

  h1{
    font-size:clamp(24px,4vw,34px);
    margin:0 0 6px;
    text-align:center;
  }
  .subtitle{
    color:var(--text-dim);
    margin:0 0 40px;
    text-align:center;
    font-size:14px;
  }

  .choice-row{
    display:flex;
    gap:20px;
    flex-wrap:wrap;
    justify-content:center;
  }
  .choice-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:16px;
    padding:28px 24px;
    width:250px;
    height:120px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:transform .18s ease,border-color .18s ease;
    text-align:center;
  }
  .choice-card:hover{
    transform:translateY(-4px);
    border-color:var(--accent);
  }
  .choice-card .en{font-size:16px;font-weight:600;}

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:20px;
    padding:32px;
    width:100%;
    max-width:420px;
  }

  .back-btn{
    background:none;
    border:none;
    color:var(--text-dim);
    cursor:pointer;
    font-size:13px;
    margin-bottom:18px;
    padding:0;
  }
  .back-btn:hover{color:var(--accent);}

  .mode-heading{
    text-align:center;
    margin-bottom:24px;
    font-size:16px;
    font-weight:600;
  }

  .field-row{
    display:flex;
    gap:10px;
    margin-bottom:20px;
  }
  select{
    flex:1;
    background:var(--surface-2);
    color:var(--text);
    border:1px solid var(--border);
    border-radius:10px;
    padding:10px 8px;
    font-size:14px;
    min-width:0;
  }
  select:focus{outline:none;border-color:var(--accent);}

  .convert-btn{
    width:100%;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    color:#0a0a0a;
    border:none;
    border-radius:12px;
    padding:14px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    transition:opacity .15s ease;
  }
  .convert-btn:hover{opacity:.88;}
  .convert-btn:disabled{opacity:.5;cursor:default;}

  .result{
    margin-top:22px;
    padding:18px;
    border-radius:14px;
    background:var(--surface-2);
    border:1px solid var(--border);
    text-align:center;
    display:none;
  }
  .result.show{display:block;}
  .result .big{
    font-size:20px;
    font-weight:700;
    margin-bottom:4px;
  }
  .result .small{
    font-size:13px;
    color:var(--text-dim);
  }
  .result.error{
    border-color:var(--danger);
    color:var(--danger);
  }

  @media (max-width:480px){
    .choice-card{width:100%;max-width:300px;}
  }
</style>
</head>
<body>

<div class="blob b1"></div>
<div class="blob b2"></div>
<div class="blob b3"></div>

<button class="theme-toggle" id="themeToggle">☀️ Light</button>

<!-- Screen 1: choose direction -->
<div class="screen" id="chooserScreen">
  <h1>Calendar Converter</h1>
  <p class="subtitle">Convert dates between the Gregorian and Persian calendars</p>
  <div class="choice-row">
    <div class="choice-card" data-mode="g2p">
      <div class="en">Gregorian → Persian</div>
    </div>
    <div class="choice-card" data-mode="p2g">
      <div class="en">Persian → Gregorian</div>
    </div>
  </div>
</div>

<!-- Screen 2: converter -->
<div class="screen" id="converterScreen" hidden>
  <div class="card">
    <button class="back-btn" id="backBtn">← Change direction</button>
    <div class="mode-heading" id="modeEn"></div>

    <div class="field-row">
      <select id="yearSelect"></select>
      <select id="monthSelect"></select>
      <select id="daySelect"></select>
    </div>

    <button class="convert-btn" id="convertBtn">Convert</button>

    <div class="result" id="result">
      <div class="big" id="resultBig"></div>
      <div class="small" id="resultSmall"></div>
    </div>
  </div>
</div>

<script>
(function(){
  var GREGORIAN_MONTHS = [
    'January', 'February', 'March', 'April', 'May', 'June',
    'July', 'August', 'September', 'October', 'November', 'December'
  ];
  var PERSIAN_MONTHS = [
    'فروردین', 'اردیبهشت', 'خرداد', 'تیر', 'مرداد', 'شهریور',
    'مهر', 'آبان', 'آذر', 'دی', 'بهمن', 'اسفند'
  ];

  function isGregorianLeap(y){
    return (y % 4 === 0 && y % 100 !== 0) || (y % 400 === 0);
  }
  // standard 33-year cycle approximation used by most jalali calendar widgets
  function isJalaliLeap(y){
    var cycle = ((y % 33) + 33) % 33;
    return [1,5,9,13,17,22,26,30].indexOf(cycle) !== -1;
  }
  function daysInGregorianMonth(y, m){
    var lengths = [31,28,31,30,31,30,31,31,30,31,30,31];
    if (m === 2 && isGregorianLeap(y)) return 29;
    return lengths[m-1];
  }
  function daysInJalaliMonth(y, m){
    if (m <= 6) return 31;
    if (m <= 11) return 30;
    return isJalaliLeap(y) ? 30 : 29;
  }

  var mode = null; // 'g2p' or 'p2g'
  var chooserScreen = document.getElementById('chooserScreen');
  var converterScreen = document.getElementById('converterScreen');
  var yearSelect = document.getElementById('yearSelect');
  var monthSelect = document.getElementById('monthSelect');
  var daySelect = document.getElementById('daySelect');
  var resultEl = document.getElementById('result');
  var resultBig = document.getElementById('resultBig');
  var resultSmall = document.getElementById('resultSmall');

  function pad(n){ return String(n).padStart(2,'0'); }

  function populateYears(){
    yearSelect.innerHTML = '';
    var isGregorianSource = mode === 'g2p';
    var start = isGregorianSource ? 1920 : 1300;
    var end = isGregorianSource ? 2075 : 1454;
    var current = isGregorianSource ? new Date().getFullYear() : 1404;
    for (var y = start; y <= end; y++){
      var opt = document.createElement('option');
      opt.value = y;
      opt.textContent = y;
      if (y === current) opt.selected = true;
      yearSelect.appendChild(opt);
    }
  }

  function populateMonths(){
    monthSelect.innerHTML = '';
    var isPersianSource = mode === 'p2g';
    var months = isPersianSource ? PERSIAN_MONTHS : GREGORIAN_MONTHS;
    months.forEach(function(name, i){
      var opt = document.createElement('option');
      opt.value = i + 1;
      opt.textContent = name;
      if (isPersianSource) opt.className = 'fa';
      monthSelect.appendChild(opt);
    });
    monthSelect.classList.toggle('fa', isPersianSource);
  }

  function populateDays(){
    var y = parseInt(yearSelect.value, 10);
    var m = parseInt(monthSelect.value, 10);
    var count = mode === 'g2p' ? daysInGregorianMonth(y, m) : daysInJalaliMonth(y, m);
    var prevValue = parseInt(daySelect.value, 10) || 1;
    daySelect.innerHTML = '';
    for (var d = 1; d <= count; d++){
      var opt = document.createElement('option');
      opt.value = d;
      opt.textContent = d;
      if (d === prevValue) opt.selected = true;
      daySelect.appendChild(opt);
    }
  }

  function startMode(m){
    mode = m;
    document.getElementById('modeEn').textContent = m === 'g2p' ? 'Gregorian → Persian' : 'Persian → Gregorian';
    populateYears();
    populateMonths();
    populateDays();
    resultEl.classList.remove('show', 'error');
    chooserScreen.hidden = true;
    converterScreen.hidden = false;
  }

  document.querySelectorAll('.choice-card').forEach(function(card){
    card.addEventListener('click', function(){
      startMode(card.getAttribute('data-mode'));
    });
  });

  document.getElementById('backBtn').addEventListener('click', function(){
    converterScreen.hidden = true;
    chooserScreen.hidden = false;
  });

  yearSelect.addEventListener('change', populateDays);
  monthSelect.addEventListener('change', populateDays);

  document.getElementById('convertBtn').addEventListener('click', function(){
    var y = yearSelect.value;
    var m = pad(monthSelect.value);
    var d = pad(daySelect.value);
    var dateStr = y + '/' + m + '/' + d;
    var endpoint = mode === 'g2p' ? '/convert-to-persian' : '/convert-to-gregorian';
    var btn = document.getElementById('convertBtn');
    btn.disabled = true;

    fetch(endpoint, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({date: dateStr})
    }).then(function(res){
      if (!res.ok){
        return res.text().then(function(text){ throw new Error(text || 'Conversion failed'); });
      }
      return res.json();
    }).then(function(data){
      var resultDate = mode === 'g2p' ? data.persianDate : data.gregorianDate;
      var parts = resultDate.split('/');
      var isPersianTarget = mode === 'g2p';
      var targetMonths = isPersianTarget ? PERSIAN_MONTHS : GREGORIAN_MONTHS;
      var monthName = targetMonths[parseInt(parts[1], 10) - 1];
      resultBig.textContent = resultDate;
      resultSmall.textContent = parseInt(parts[2], 10) + ' ' + monthName + ' ' + parts[0];
      resultSmall.classList.toggle('fa', isPersianTarget);
      resultEl.classList.remove('error');
      resultEl.classList.add('show');
    }).catch(function(err){
      resultBig.textContent = 'Conversion failed';
      resultSmall.textContent = err.message;
      resultEl.classList.add('show', 'error');
    }).finally(function(){
      btn.disabled = false;
    });
  });

  // theme handling, default dark
  var themeToggle = document.getElementById('themeToggle');
  function applyTheme(theme){
    document.documentElement.setAttribute('data-theme', theme);
    themeToggle.textContent = theme === 'dark' ? '☀️ Light' : '🌙 Dark';
    try { localStorage.setItem('calendar-converter-theme', theme); } catch(e){}
  }
  var savedTheme = 'dark';
  try { savedTheme = localStorage.getItem('calendar-converter-theme') || 'dark'; } catch(e){}
  applyTheme(savedTheme);
  themeToggle.addEventListener('click', function(){
    var current = document.documentElement.getAttribute('data-theme');
    applyTheme(current === 'dark' ? 'light' : 'dark');
  });
})();
</script>
</body>
</html>
